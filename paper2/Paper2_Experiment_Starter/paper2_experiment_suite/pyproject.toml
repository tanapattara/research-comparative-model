[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2-mekong-forecast"
version = "0.1.0"
description = "Leakage-safe starter suite for multi-station, multi-horizon Nong Khai water-level forecasting"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
neural = ["torch>=2.3,<3"]
tuning = ["torch>=2.3,<3", "optuna>=4,<5"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
